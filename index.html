/* ─── Cümlede kelimeyi maskele ─── */
function maskAnswer(sentence, word){
  const re=new RegExp('\\b'+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
  const masked=sentence.replace(re,'___');
  return masked===sentence ? '___  ('+word+' içeren cümle)' : masked;
}

/* ─── Build lesson ─── */
function buildLesson(dayNum){
  const idx=(dayNum-1)*10;
  const words=[];
  for(let i=0;i<10;i++) words.push(WORD_BANK[(idx+i)%WORD_BANK.length]);
  const grammar=GRAMMAR_BANK[(dayNum-1)%GRAMMAR_BANK.length];

  const makeTests=(slice)=>slice.map(w=>{
    const q=maskAnswer(w.ex, w.en);
    const wrongs=pick(WORD_BANK.filter(x=>x.en!==w.en),3).map(x=>x.en);
    return {q, ans:w.en, opts:shuffle([w.en,...wrongs]), tr:w.tr, exTr:w.exTr||''};
  });

  return {
    words,
    grammar,
    tests:{
      gunluk:  makeTests(words.slice(0,5)),
      sosyal:  makeTests(words.slice(2,7)),
      seyahat: makeTests(words.slice(5,10)),
    },
    translations: words.slice(0,5).map(w=>{
      const wrong=pick(WORD_BANK.filter(x=>x.en!==w.en),3).map(x=>x.en);
      return {tr:w.tr, ans:w.en, opts:shuffle([w.en,...wrong]), ex:w.ex, exTr:w.exTr||''};
    }),
  };
}

/* ─── CONFETTI ─── */
function Confetti(){
  const p=Array.from({length:60},(_,i)=>({id:i,col:CONFETTI_COLS[i%6],left:`${Math.random()*100}%`,delay:`${Math.random()*1.5}s`,dur:`${2.2+Math.random()*1.8}s`,sz:`${6+Math.random()*9}px`,sh:Math.random()>.5?'50%':'2px'}));
  return html`<div style=${{position:'fixed',inset:0,pointerEvents:'none',zIndex:9999,overflow:'hidden'}}>
    ${p.map(x=>html`<div key=${x.id} style=${{position:'absolute',top:'-20px',left:x.left,width:x.sz,height:x.sz,borderRadius:x.sh,background:x.col,animation:`confettiFall ${x.dur} ${x.delay} ease-in forwards`}}></div>`)}
  </div>`;
}

/* ─── localStorage helpers ─── */
function lsGet(key,def){try{const v=localStorage.getItem('eu_'+key);if(v===null)return def;const p=JSON.parse(v);if(key==='completedDays'||key==='sentenceDoneDays'||key==='weeklyTestDone')return new Set(p);if(key==='allEarnedSteps'){const r={};for(const k in p)r[k]=new Set(p[k]);return r;}return p;}catch(e){return def;}}
function lsSave(key,val){try{if(val instanceof Set)localStorage.setItem('eu_'+key,JSON.stringify([...val]));else if(key==='allEarnedSteps'){const r={};for(const k in val)r[k]=[...val[k]];localStorage.setItem('eu_'+key,JSON.stringify(r));}else localStorage.setItem('eu_'+key,JSON.stringify(val));}catch(e){}}

  const lv=getLv(xp);

  const todayIdx=new Date().getDay()===0?6:new Date().getDay()-1;

  const dayLocked=sentencePending||weeklyTestPending;

  /* addXP — only once per step key */
  const addXP=useCallback((amount,stepKey)=>{
    if(stepKey){
      const dayKey=stepKey.startsWith('levelup')||stepKey.startsWith('practice')||stepKey.startsWith('family')?'global':String(currentDay);
      const daySet=allEarnedSteps[dayKey]||new Set();
      if(daySet.has(stepKey)) return;

  },[allEarnedSteps,currentDay]);
  const recordMistake=useCallback((word,tr,cat)=>{
    setMistakes(prev=>{
      const ex=prev.find(m=>m.word===word);
      const updated=ex?prev.map(m=>m.word===word?{...m,errors:m.errors+1,dates:[...m.dates,'az önce']}:m):[...prev,{word,tr,errors:1,dates:['az önce'],cat}];
      lsSave('mistakes',updated);

  },[]);

  // Lesson state auto-save

  },[view,lessonStep,wordIdx,testSubm,transRevealed,testTab,spellIdx]);

  // Physical keyboard listener for spelling test
  React.useEffect(()=>{
    if(view!=='lesson'||lessonStep!==5) return;
    const handler=(e)=>{
      const k=e.key;
      if(spellBlocked&&k!=='Enter') return; // yanlış harf animasyonu bitene kadar engelle
      // Enter = sonraki kelime (eğer kelime tamamlandıysa)
      if(k==='Enter'){
        if(spellDone){
          const word2=lesson?.words?.[spellIdx];
          if(!word2) return;
          if(spellIdx<lesson.words.length-1){
            setSpellIdx(i=>i+1);
            setSpellTyped([]);setSpellWrong(new Set());setSpellRevealed(new Set());setSpellDone(false);setSpellBlocked(false);
          } else {
            setSpellFinished(true);
          }
        }
        return;
      }
      if(k==='Backspace'){
        if(spellDone) return;
        // En sondaki dolu pozisyonu sil (ipucu da dahil)
        const word2=lesson?.words?.[spellIdx];
        if(!word2) return;
        const lets=word2.en.split('');
        // Sağdan sola: boşluk olmayan son dolu pozisyonu bul
        let deletePos=-1;
        for(let i=lets.length-1;i>=0;i--){
          if(lets[i]===' ') continue;
          if(spellRevealed.has(i)||spellTyped[i]!==undefined){deletePos=i;break;}
        }
        if(deletePos===-1) return;
        if(spellRevealed.has(deletePos)){
          // İpucu harfini revealed'dan çıkar
          setSpellRevealed(p=>{const n=new Set(p);n.delete(deletePos);return n;});
          setSpellTyped(t=>{const u=[...t];u[deletePos]=undefined;return u;});
        } else {
          setSpellTyped(t=>{const u=[...t];u[deletePos]=undefined;return u;});
        }
        return;
      }
      // Space tuşu — sadece boşluklu kelimeler için (örn: "Thank you")
      if(k===' '){
        e.preventDefault(); // sayfa scroll etmesin
        const word=lesson?.words?.[spellIdx];
        if(!word||spellDone) return;
        const letters=word.en.split('');
        const nextPos=letters.findIndex((_,i)=>spellTyped[i]===undefined&&!spellRevealed.has(i));
        if(nextPos===-1) return;
        // Eğer o pozisyonda boşluk varsa otomatik atla
        if(letters[nextPos]===' '){
          const newTyped=[...spellTyped];newTyped[nextPos]=' ';
          setSpellTyped(newTyped);
          const allDone=letters.every((_,i)=>i===nextPos||(newTyped[i]!==undefined&&!spellWrong.has(i))||spellRevealed.has(i));
          if(allDone){const hc=[...spellRevealed].filter(r=>r<letters.length).length;addXP(hc===0?20:hc<=2?12:6,'spell_word_'+currentDay+'_'+spellIdx);setSpellDone(true);}
        }
        return;
      }
      if(/^[a-zA-Z]$/.test(k)){
        const word=lesson?.words?.[spellIdx];
        if(!word||spellDone) return;
        const letters=word.en.split('');
        let nextPos=letters.findIndex((_,i)=>spellTyped[i]===undefined&&!spellRevealed.has(i));
        if(nextPos===-1) return;
        // Eğer o pozisyonda boşluk varsa, boşluğu otomatik doldur ve bir sonraki pozisyona geç
        if(letters[nextPos]===' '){
          const tmp=[...spellTyped];tmp[nextPos]=' ';
          setSpellTyped(tmp);
          nextPos=letters.findIndex((_,i)=>i>nextPos&&tmp[i]===undefined&&!spellRevealed.has(i));
          if(nextPos===-1) return;
        }
        const correct=k.toLowerCase()===letters[nextPos].toLowerCase();
        const newTyped=[...spellTyped];
        // Boşlukları da doldur
        letters.forEach((l,i)=>{if(l===' '&&newTyped[i]===undefined) newTyped[i]=' ';});
        newTyped[nextPos]=k;
        setSpellTyped(newTyped);
        if(!correct){
          const nw=new Set([...spellWrong,nextPos]);setSpellWrong(nw);setSpellBlocked(true);
          setTimeout(()=>{setSpellTyped(t=>{const u=[...t];u[nextPos]=undefined;return u;});setSpellWrong(w=>{const n=new Set(w);n.delete(nextPos);return n;});setSpellBlocked(false);},700);
        } else {
          const allDone=letters.every((_,i)=>spellRevealed.has(i)||newTyped[i]!==undefined);

  // Haftalık sınav klavye
  React.useEffect(()=>{
    if(!weeklyView||weeklyFinished) return;

    const wLetters2=wq2.en.split('');
    const h=(e)=>{
      if(weeklyBlocked&&e.key!=='Enter') return;
      if(e.key==='Enter'){
        if(weeklyDone){
          if(weeklyQIdx<weeklyQuestions.length-1){
            setWeeklyQIdx(i=>i+1);
            setWeeklyTyped([]);setWeeklyWrong(new Set());setWeeklyRevealed(new Set());
            setWeeklyDone(false);setWeeklyBlocked(false);
          } else finishWeeklyTest(weeklyScore);
        }
        return;
      }
      if(weeklyDone) return;
      if(e.key==='Backspace'){
        // İpucu da dahil son dolu harfi sil
        const wq3=weeklyQuestions[weeklyQIdx];
        if(!wq3) return;
        const wl3=wq3.en.split('');
        let dPos3=-1;
        for(let i=wl3.length-1;i>=0;i--){
          if(wl3[i]===' ') continue;
          if(weeklyRevealed.has(i)||weeklyTyped[i]!==undefined){dPos3=i;break;}
        }
        if(dPos3!==-1){
          if(weeklyRevealed.has(dPos3)){
            setWeeklyRevealed(p=>{const n=new Set(p);n.delete(dPos3);return n;});
          }
          setWeeklyTyped(t=>{const u=[...t];u[dPos3]=undefined;return u;});
        }
        return;
      }
      if(!/^[a-zA-Z]$/.test(e.key)) return;
      let pos2=wLetters2.findIndex((_,i)=>weeklyTyped[i]===undefined&&!weeklyRevealed.has(i));
      if(pos2===-1) return;
      if(wLetters2[pos2]===' '){const tmp=[...weeklyTyped];tmp[pos2]=' ';setWeeklyTyped(tmp);pos2=wLetters2.findIndex((_,i)=>i>pos2&&tmp[i]===undefined&&!weeklyRevealed.has(i));if(pos2===-1)return;}
      const correct2=e.key.toLowerCase()===wLetters2[pos2].toLowerCase();
      const newT2=[...weeklyTyped];
      wLetters2.forEach((l,i)=>{if(l===' '&&newT2[i]===undefined)newT2[i]=' ';});
      newT2[pos2]=e.key;
      setWeeklyTyped(newT2);
      if(!correct2){
        setWeeklyWrong(w=>new Set([...w,pos2]));setWeeklyBlocked(true);
        setTimeout(()=>{setWeeklyTyped(t=>{const u=[...t];u[pos2]=undefined;return u;});setWeeklyWrong(w=>{const n=new Set(w);n.delete(pos2);return n;});setWeeklyBlocked(false);},700);
      } else {
        const done2=wLetters2.every((_,i)=>newT2[i]!==undefined||weeklyRevealed.has(i));
        if(done2){
          const hc2=[...weeklyRevealed].filter(r=>r<wLetters2.length).length;
          const pts2=hc2===0?3:hc2<=2?2:1;
          setWeeklyScore(p=>p+pts2);
          // Haftalık sınav XP vermez
          setWeeklyDone(true);
        }
      }
    };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);

  // Bonus yazım testi klavye
  React.useEffect(()=>{
    if(!showBonus||bonusFinished) return;
    const bw=BONUS_WEEKS[bonusWeekNum];
    if(!bw) return;
    const act=bw.activities[bonusQIdx];
    if(!act||act.type!=='spell') return;

    const items=act.items;
    const parts=(bonusChosen||'').split('|');
    const itemIdx=parseInt(parts[0])||0;
    const typedArr=(parts[1]||'').split(',').filter(x=>x!=='');
    const revSet=new Set((parts[2]||'').split(',').filter(x=>x!=='').map(Number));
    const isDone=parts[3]==='done';
    const item=items[itemIdx];
    if(!item) return;
    const letters2=item.ans.split('');

    const h=(e)=>{
      if(bonusBlocked) return;

      // Enter → kelime tamam ise sonraki
      if(e.key==='Enter'){
        e.preventDefault();
        if(!isDone) return;
        if(itemIdx<items.length-1){
          setBonusChosen((itemIdx+1)+'| | |');
          setBonusBlocked(false);
        } else {
          // Son kelime → sonraki aktivite
          if(bonusQIdx<bw.activities.length-1){
            setBonusQIdx(i=>i+1);setBonusChosen(null);setBonusAnswered(false);setBonusBlocked(false);
          } else setBonusFinished(true);
        }
        return;
      }

      if(isDone) return;

      // Backspace
      if(e.key==='Backspace'){
        let dPos=-1;
        for(let i=letters2.length-1;i>=0;i--){
          if(letters2[i]===' ') continue;
          if(revSet.has(i)||typedArr[i]!==undefined){dPos=i;break;}
        }
        if(dPos!==-1){
          const nr=new Set(revSet); const nt=[...typedArr];
          if(revSet.has(dPos)) nr.delete(dPos);
          nt[dPos]=undefined;
          setBonusChosen(itemIdx+'|'+nt.join(',')+'|'+[...nr].join(',')+' |');
        }
        return;
      }

      // Space → ipucu
      if(e.key===' '){
        e.preventDefault();
        let pos2=letters2.findIndex((_,i)=>typedArr[i]===undefined&&!revSet.has(i));
        if(pos2===-1) return;
        const nr2=new Set([...revSet,pos2]);
        const allDone2=letters2.every((_,i)=>typedArr[i]!==undefined||nr2.has(i)||letters2[i]===' ');
        setBonusChosen(itemIdx+'|'+typedArr.join(',')+'|'+[...nr2].join(',')+' |'+(allDone2?'done':''));
        return;
      }

      if(!/^[a-zA-Z]$/.test(e.key)) return;

      // Harf tuşu
      let pos3=letters2.findIndex((_,i)=>typedArr[i]===undefined&&!revSet.has(i));
      if(pos3===-1) return;
      if(letters2[pos3]===' '){
        const tmp=[...typedArr]; tmp[pos3]=' ';
        pos3=letters2.findIndex((_,i)=>i>pos3&&tmp[i]===undefined&&!revSet.has(i));
        if(pos3===-1) return;
      }
      const ok2=e.key.toLowerCase()===letters2[pos3].toLowerCase();
      const nt2=[...typedArr];
      letters2.forEach((l,i)=>{if(l===' '&&nt2[i]===undefined)nt2[i]=' ';});
      nt2[pos3]=e.key;
      if(!ok2){
        setBonusBlocked(true);
        const wt=[...nt2]; wt[pos3]=undefined;
        setBonusChosen(itemIdx+'|'+wt.join(',')+'|'+[...revSet].join(',')+' |wrong_'+pos3);
        setTimeout(()=>{
          setBonusChosen(itemIdx+'|'+wt.join(',')+'|'+[...revSet].join(',')+' |');
          setBonusBlocked(false);
        },400);
      } else {
        const allOk=letters2.every((_,i)=>nt2[i]!==undefined||revSet.has(i));
        setBonusChosen(itemIdx+'|'+nt2.join(',')+'|'+[...revSet].join(',')+' |'+(allOk?'done':''));
      }
    };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[showBonus,bonusQIdx,bonusChosen,bonusWeekNum,bonusFinished,bonusBlocked]);

            `}
          `}

          ${lessonStep===4&&html`
            <div style=${{background:'rgba(56,189,248,0.06)',border:'1px solid rgba(56,189,248,0.14)',borderRadius:16,padding:'14px 18px',marginBottom:18}} className="fadeUp">
              <div style=${{fontSize:14,color:C.text,lineHeight:1.6}}>🇹🇷 → 🇬🇧 Türkçe anlamı gör, doğru İngilizce kelimeyi seç!</div>
            </div>
            ${lesson.translations.map((t,i)=>{
              const answered=transRevealed.has(i);
              const chosen=testAns['tr_'+i];
              const ok=answered&&chosen===t.ans;
              const wr=answered&&chosen!==t.ans;
              return html`
                <div key=${i} style=${{background:C.c1,borderRadius:18,padding:18,marginBottom:14,border:`1.5px solid ${answered?(ok?TC.accent:C.red):C.brd}`,transition:'border-color .3s'}}>
                  <div style=${{fontSize:12,color:C.muted,marginBottom:6}}>Cümleyi Türkçeye çevir:</div>
                  <div style=${{...SY,fontSize:26,fontWeight:800,marginBottom:6,color:C.text}}>${t.tr}</div>

                  <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    ${t.opts.map(o=>{

                        if(o===t.ans){bg='rgba(16,232,168,0.12)';cl=TC.accent;br=TC.accent;}

                      } else if(o===chosen){bg='rgba(16,232,168,0.08)';br=TC.accent;cl=TC.accent;}
                      return html`<button key=${o}
                        onClick=${()=>{
                          if(answered) return;
                          setTestAns(p=>({...p,['tr_'+i]:o}));
                          setTransRevealed(p=>new Set([...p,i]));

                      </button>`;

                  `}

            })}
            ${allTransDone&&html`
              <button onClick=${()=>{
                addXP(15,'trans_done_'+currentDay);
                setSpellIdx(0);setSpellTyped([]);setSpellWrong(new Set());setSpellRevealed(new Set());setSpellDone(false);setSpellBlocked(false);setSpellFinished(false);
                setLessonStep(5);
              }} style=${{width:'100%',padding:16,borderRadius:14,background:'linear-gradient(135deg,'+TC.accent+','+TC.blue+')',color:'#000',fontSize:16,fontWeight:800,...SY,marginTop:8}}>

              </button>
            `}
          `}

          ${lessonStep===5&&html`
            <div className="fadeUp">
              <div style=${{background:'linear-gradient(135deg,rgba(192,132,252,0.07),rgba(56,189,248,0.05))',border:'1px solid rgba(192,132,252,0.18)',borderRadius:16,padding:'13px 18px',marginBottom:18}}>
                <div style=${{...SY,fontSize:11,color:C.purple,fontWeight:700,letterSpacing:.5,marginBottom:4}}>✍️ YAZIM TESTİ</div>
                <div style=${{fontSize:13,color:C.text,lineHeight:1.6}}>Türkçe anlamı gör, İngilizce yazımını bul. Yanlış harf kırmızı olur, doğru harf kalır. Takılırsan ipucu al!</div>

              <div style=${{display:'flex',gap:4,marginBottom:20}}>
                ${lesson.words.map((_,i)=>html`<div key=${i} style=${{height:4,flex:1,borderRadius:2,background:i<spellIdx?TC.accent:i===spellIdx?C.purple:C.c2,transition:'background .3s'}}></div>`)}
              </div>

              ${(()=>{
                if(spellFinished) return html`
                  <div style=${{textAlign:'center',padding:'32px 20px'}} className="pop">
                    <div style=${{fontSize:72,marginBottom:16}}>✍️</div>
                    <div style=${{...SY,fontSize:28,fontWeight:800,marginBottom:8}}>Yazım Testi Bitti!</div>
                    <div style=${{fontSize:15,color:C.muted,marginBottom:24,lineHeight:1.7}}>Tüm ${lesson.words.length} kelimeyi yazdın!</div>
                    <button onClick=${()=>{addXP(30,'spell_done_'+currentDay);setLessonStep(6);}} style=${{width:'100%',padding:16,borderRadius:14,background:C.purple,color:'#fff',fontSize:15,fontWeight:800,...SY}}>
                      🎉 Günü Tamamla! (+30 XP)
                    </button>
                  </div>`;
                const word = lesson.words[spellIdx];
                const letters = word.en.split('');
                const totalLetters = letters.length;
                // build display: revealed=green shown, typed correct=green, wrong=red flash, untyped=blank
                const getBoxState = (pos) => {
                  if(spellRevealed.has(pos)) return 'hint';
                  if(spellTyped[pos]!==undefined){
                    if(spellTyped[pos].toLowerCase()===letters[pos].toLowerCase()) return 'correct';
                    return 'wrong';
                  }
                  if(pos===spellTyped.filter((_,i)=>!spellWrong.has(i)).length + [...spellRevealed].filter(r=>r<pos).length) return 'active';
                  return 'empty';
                };

                // find next position to fill
                const nextPos = letters.findIndex((_,i)=>spellTyped[i]===undefined && !spellRevealed.has(i));
                const handleKey = (char) => {
                  if(spellDone||spellBlocked) return;
                  let pos = nextPos;
                  if(pos===-1) return;
                  // boşluğu otomatik atla
                  if(letters[pos]===' '){
                    const tmp=[...spellTyped];tmp[pos]=' ';
                    setSpellTyped(tmp);
                    pos=letters.findIndex((_,i)=>i>pos&&tmp[i]===undefined&&!spellRevealed.has(i));
                    if(pos===-1) return;
                  }
                  const correct = char.toLowerCase()===letters[pos].toLowerCase();
                  const newTyped=[...spellTyped];
                  // tüm boşlukları doldur
                  letters.forEach((l,i)=>{if(l===' '&&newTyped[i]===undefined) newTyped[i]=' ';});
                  newTyped[pos]=char;
                  setSpellTyped(newTyped);
                  if(!correct){
                    const nw=new Set([...spellWrong,pos]);
                    setSpellWrong(nw);setSpellBlocked(true);
                    setTimeout(()=>{
                      setSpellTyped(t=>{const u=[...t];u[pos]=undefined;return u;});
                      setSpellWrong(w=>{const n=new Set(w);n.delete(pos);return n;});
                      setSpellBlocked(false);
                    },700);
                  } else {
                    const allDone=letters.every((_,i)=>spellRevealed.has(i)||newTyped[i]!==undefined);
                    if(allDone){
                      const hintCount=[...spellRevealed].filter(r=>r<totalLetters).length;
                      const xpEarned=hintCount===0?20:hintCount<=2?12:6;
                      addXP(xpEarned,'spell_word_'+currentDay+'_'+spellIdx);
                      setSpellDone(true);
                    }
                  }
                };
                const giveHint = () => {
                  if(nextPos===-1&&!spellDone) return;
                  if(nextPos===-1) return;
                  const newRev=new Set([...spellRevealed,nextPos]);
                  setSpellRevealed(newRev);
                  // Eğer bu ipucuyla tüm harfler doluysa kelimeyi tamamla
                  const allRevealed=letters.every((_,i)=>spellTyped[i]!==undefined||newRev.has(i)||letters[i]===' ');
                  if(allRevealed&&!spellDone){
                    const hintCount=newRev.size;
                    addXP(6,'spell_word_'+currentDay+'_'+spellIdx);
                    setSpellDone(true);
                  }
                };
                const nextWord = () => {
                  if(spellIdx<lesson.words.length-1){
                    setSpellIdx(i=>i+1);
                    setSpellTyped([]);setSpellWrong(new Set());setSpellRevealed(new Set());setSpellDone(false);setSpellBlocked(false);setSpellBlocked(false);
                  } else setSpellFinished(true);
                };

                return html`
                  <div style=${{background:C.c1,borderRadius:20,padding:22,marginBottom:18,border:`1px solid ${C.brd}`}}>
                    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                      <span style=${{fontSize:12,color:C.muted}}>Kelime ${spellIdx+1} / ${lesson.words.length}</span>
                      <span style=${{background:'rgba(192,132,252,0.1)',color:C.purple,borderRadius:8,padding:'3px 10px',fontSize:11,fontWeight:700,...SY}}>${word.level}</span>
                    </div>
                    <div style=${{textAlign:'center',padding:'12px 0 16px'}}>
                      <div style=${{fontSize:13,color:C.muted,marginBottom:6}}>Türkçe anlamı:</div>
                      <div style=${{...SY,fontSize:28,fontWeight:800,color:C.text}}>${word.tr}</div>
                      <div style=${{fontSize:13,color:C.muted,fontStyle:'italic',marginTop:8}}>${word.exTr||''}</div>
                    </div>
                    <div style=${{display:'flex',gap:3,justifyContent:'center',flexWrap:'nowrap',overflowX:'auto',marginBottom:8,paddingBottom:4}} className="sh">
                      ${letters.map((letter,pos)=>{
                        const st=getBoxState(pos);
                        const isSpace=letter===' ';
                        if(isSpace) return html`<div key=${pos} style=${{width:8}}></div>`;
                        const bgMap={hint:'rgba(16,232,168,0.15)',correct:'rgba(16,232,168,0.15)',wrong:'rgba(248,113,113,0.2)',active:'rgba(192,132,252,0.1)',empty:'rgba(255,255,255,0.04)'};
                        const borderMap={hint:TC.accent,correct:TC.accent,wrong:C.red,active:C.purple,empty:C.brd};
                        const colorMap={hint:TC.accent,correct:TC.accent,wrong:C.red,active:C.purple,empty:'transparent'};
                        const showChar=st==='hint'||st==='correct';
                        return html`
                          <div key=${pos} style=${{
                            width:Math.max(18,Math.min(34,Math.floor(330/(totalLetters+1)))),
                            height:Math.max(26,Math.min(42,Math.floor(340/(totalLetters+1)))),
                            borderRadius:6,border:'2px solid '+borderMap[st],
                            background:bgMap[st],display:'flex',alignItems:'center',justifyContent:'center',
                            transition:'all .25s',...SY,
                            fontSize:Math.max(10,Math.min(18,Math.floor(300/(totalLetters+1)))),
                            fontWeight:800,
                            color:colorMap[st],
                            animation:st==='wrong'?'pulse .3s ease':'none',
                            flexShrink:0
                          }}>
                            ${showChar?letter.toUpperCase():''}
                          </div>`;
                      })}
                    </div>
                    ${!spellDone&&html`<div style=${{textAlign:'center',fontSize:12,color:C.muted,marginTop:4}}>${totalLetters} harf</div>`}
                    ${spellDone&&html`
                      <div style=${{textAlign:'center',marginTop:8}}>
                        <div style=${{...SY,fontSize:16,fontWeight:700,color:TC.accent,marginBottom:4}}>
                          ✅ Doğru! ${[...spellRevealed].length===0?'+20 XP':[...spellRevealed].length<=2?'+12 XP':'+6 XP'}
                        </div>
                        <div style=${{fontSize:13,color:C.muted,fontStyle:'italic'}}>"${word.ex}"</div>
                      </div>
                    `}
                  </div>

                  ${!spellDone&&html`
                    <button onClick=${giveHint} style=${{width:'100%',padding:'11px 0',borderRadius:13,background:'rgba(192,132,252,0.08)',border:'1px solid rgba(192,132,252,0.2)',color:C.purple,fontWeight:700,fontSize:13,...SY,marginBottom:14}}>
                      💡 İpucu — Sonraki Harfi Göster
                    </button>
                  `}
                  ${spellDone&&html`
                    <button onClick=${nextWord} style=${{width:'100%',padding:14,borderRadius:14,background:C.purple,color:'#fff',fontSize:15,fontWeight:700,...SY,marginBottom:14}}>
                      ${spellIdx<lesson.words.length-1?'Sonraki Kelime →':'Testi Bitir →'}
                    </button>
                  `}

                  ${!spellDone&&html`
                    <div style=${{background:C.c1,borderRadius:18,padding:14,border:`1px solid ${C.brd}`}}>
                      <div style=${{fontSize:11,color:C.muted,textAlign:'center',marginBottom:10,fontWeight:600}}>Harfe tıkla veya klavyeni kullan</div>
                      ${[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M','⌫']].map((row,ri)=>html`
                        <div key=${ri} style=${{display:'flex',gap:5,justifyContent:'center',marginBottom:7}}>
                          ${row.map(k=>html`
                            <button key=${k} onClick=${()=>{
                              if(k==='⌫'){
                                // İpucu da dahil son dolu harfi sil
                                let dPos=-1;
                                for(let i=letters.length-1;i>=0;i--){
                                  if(letters[i]===' ') continue;
                                  if(spellRevealed.has(i)||spellTyped[i]!==undefined){dPos=i;break;}

                                if(dPos!==-1){
                                  if(spellRevealed.has(dPos)){
                                    setSpellRevealed(p=>{const n=new Set(p);n.delete(dPos);return n;});

                                  setSpellTyped(t=>{const u=[...t];u[dPos]=undefined;return u;});

                              background:C.c2,border:`1px solid ${C.brd}`,
                              color:C.text,fontSize:k==='⌫'?16:14,fontWeight:700,
                              minWidth:k==='⌫'?36:28,...SY
                            }}>${k}</button>
                          `)}
                        </div>
                      `)}
                    </div>
                  `}
                `;
              })()}
            </div>
          `}

          ${lessonStep===6&&html`
            <div style=${{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:460,gap:20,textAlign:'center'}} className="fadeUp">

              <div style=${{background:'linear-gradient(135deg,rgba(16,232,168,0.08),rgba(56,189,248,0.06))',border:'1px solid rgba(16,232,168,0.2)',borderRadius:24,padding:24,width:'100%'}}>
                <div style=${{...SY,fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:8}}>BU DERSTE KAZANDIN</div>

                </div>
              </div>
              <button onClick=${()=>completeDay()} style=${{width:'100%',padding:17,borderRadius:16,background:TC.accent,color:'#000',fontSize:16,fontWeight:800,...SY}}>
                Tamamla ve Ana Sayfaya Dön 🏠
              </button>
            </div>
          `}
        </div>
      </div>`;
  }

  /* ─── MISTAKES ─── */
  if(view==='mistakes') return html`
    <div style=${{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column'}}>
      <div style=${{display:'flex',alignItems:'center',gap:12,padding:'16px 20px',borderBottom:`1px solid ${C.brd}`,position:'sticky',top:0,background:C.bg,zIndex:10}}>
        <button onClick=${()=>setView('home')} style=${{background:C.c2,border:`1px solid ${C.brd}`,borderRadius:10,width:36,height:36,color:C.text,fontSize:18}}>←</button>
        <div style=${{...SY,fontSize:17,fontWeight:700}}>🔥 Hata Defterim</div>
        ${mistakes.length>0&&html`<div style=${{marginLeft:'auto',background:'rgba(248,113,113,0.1)',border:'1px solid rgba(248,113,113,0.22)',borderRadius:8,padding:'3px 10px',fontSize:12,color:C.red,fontWeight:700}}>${mistakes.length} kelime</div>`}
      </div>
      <div style=${{flex:1,overflowY:'auto',padding:'18px 20px 40px'}} className="sh">
        ${mistakes.length===0&&fixedMistakes.length===0?html`
          <div style=${{textAlign:'center',padding:'40px 20px'}}>
            <div style=${{fontSize:64,marginBottom:16}}>✨</div>
            <div style=${{...SY,fontSize:20,fontWeight:700,marginBottom:8}}>Hata Yok!</div>
            <div style=${{fontSize:14,color:C.muted,lineHeight:1.7}}>Henüz hata kaydedilmedi. Testlerde yanlış yaptığın sorular burada görünecek.</div>
          </div>
        `:html`
          <div style=${{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:20}}>
            ${[{icon:'⚠️',val:mistakes.length,lbl:'Kelime',c:C.red},{icon:'❌',val:mistakes.reduce((s,m)=>s+m.errors,0),lbl:'Toplam hata',c:C.red},{icon:'📅',val:mistakes.filter(m=>m.dates.some(d=>d==='az önce'||d==='bugün')).length,lbl:'Bugün',c:C.orange}].map((s,i)=>html`
              <div key=${i} style=${{background:C.c1,borderRadius:16,padding:'14px 10px',textAlign:'center',border:`1px solid ${C.brd}`}}>
                <div style=${{fontSize:22,marginBottom:4}}>${s.icon}</div>
                <div style=${{...SY,fontSize:22,fontWeight:700,color:s.c}}>${s.val}</div>
                <div style=${{fontSize:10,color:C.muted,marginTop:2}}>${s.lbl}</div>
              </div>
            `)}
          </div>

          ${practiceState&&html`
            <div style=${{background:'rgba(248,113,113,0.07)',border:'1px solid rgba(248,113,113,0.22)',borderRadius:22,padding:22,marginBottom:18}} className="pop">
              <div style=${{fontSize:11,color:C.red,fontWeight:700,letterSpacing:.5,marginBottom:10}}>TEST — TÜRKÇE ANLAMI NE?</div>
              <div style=${{...SY,fontSize:38,fontWeight:800,color:C.text,marginBottom:22}}>${practiceState.word}</div>
              ${!practiceState.revealed?html`
                <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9}}>
                  ${practiceState.opts.map((o,i)=>html`
                    <button key=${i}
                      onClick=${()=>{
                        const correct=o===practiceState.tr;
                        if(correct){
                          addXP(10,'practice_correct_'+practiceState.word);
                          // move to fixed list after correct answer
                          setMistakes(prev=>{
                            const updated=prev.filter(m=>m.word!==practiceState.word);
                            lsSave('mistakes',updated); return updated;
                          });
                          const fixed={word:practiceState.word,tr:practiceState.tr,fixedAt:new Date().toLocaleDateString('tr-TR')};
                          setFixedMistakes(prev=>{const u=[...prev.filter(m=>m.word!==practiceState.word),fixed]; lsSave('fixedMistakes',u); return u;});
                        } else recordMistake(practiceState.word,practiceState.tr,'Pratik');
                        setPracticeState(p=>({...p,chosen:o,revealed:true,correct}));
                      }}
                      style=${{padding:'14px 10px',borderRadius:14,background:C.c2,border:`1.5px solid ${C.brd}`,color:C.text,fontSize:13,fontWeight:600,textAlign:'center'}}>
                      ${o}
                    </button>
                  `)}
                </div>
              `:html`
                <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:16}}>
                  ${practiceState.opts.map((o,i)=>{
                    let bg=C.c2,cl=C.muted,br=C.brd;
                    if(o===practiceState.tr){bg='rgba(16,232,168,0.12)';cl=TC.accent;br=TC.accent;}
                    else if(o===practiceState.chosen&&!practiceState.correct){bg='rgba(248,113,113,0.12)';cl=C.red;br=C.red;}
                    return html`<button key=${i} disabled style=${{padding:'14px 10px',borderRadius:14,background:bg,border:`1.5px solid ${br}`,color:cl,fontSize:13,fontWeight:600,textAlign:'center'}}>${o}</button>`;
                  })}
                </div>
                <div style=${{fontSize:14,fontWeight:700,color:practiceState.correct?TC.accent:C.red,textAlign:'center',marginBottom:14}}>
                  ${practiceState.correct?'✅ Doğru! +10 XP':`❌ Yanlış! Doğru cevap: ${practiceState.tr}`}
                </div>
                <button onClick=${()=>setPracticeState(null)} style=${{width:'100%',padding:11,borderRadius:12,background:C.c2,border:`1px solid ${C.brd}`,color:C.muted,fontSize:13,fontWeight:600}}>Kapat</button>
              `}
            </div>
          `}

          ${[...mistakes].sort((a,b)=>b.errors-a.errors).map((m,i)=>html`

  /* ─── KELIME HAVUZU ─── */
  if(view==='family') return html`

        <div style=${{...SY,fontSize:17,fontWeight:700}}>🪣 Kelime Havuzu</div>
      </div>
      <div style=${{flex:1,overflowY:'auto',padding:'18px 20px 40px'}} className="sh">
        ${learnedWords.length===0?html`

            <div style=${{display:'flex',gap:7,flexWrap:'wrap'}}>
              ${learnedWords.map((ww,i)=>html`
                <button key=${i} onClick=${()=>fetchFamily(ww.en)} style=${{padding:'7px 13px',borderRadius:10,background:familyWord===ww.en?TC.accent:C.c2,color:familyWord===ww.en?'#000':C.muted,fontWeight:700,fontSize:11,border:`1px solid ${familyWord===ww.en?TC.accent:C.brd}`,...SY}}>

              <div style=${{display:'flex',flexDirection:'column',gap:9}}>

                  return html`
                    <div key=${i} style=${{display:'flex',gap:12,alignItems:'flex-start'}}>

                      </div>
                      <button onClick=${()=>setExpandedMember(isExp?null:i)} style=${{flex:1,background:isExp?`${familyData.color}09`:C.c1,border:`1.5px solid ${isExp?familyData.color:C.brd}`,borderRadius:16,padding:'14px 16px',textAlign:'left',color:C.text,transition:'all .2s'}}>

                          <button onClick=${e=>{e.stopPropagation();addXP(5,'family_'+familyData.root+'_'+i);}} style=${{marginTop:10,padding:'7px 14px',borderRadius:10,background:`${familyData.color}12`,border:`1px solid ${familyData.color}28`,color:familyData.color,fontSize:11,fontWeight:700}}>✓ Öğrendim +5 XP</button>

              </div>

  /* ─── SENTENCE BUILDER ─── */
  if(view==='sentences'){
    const total=sentWords.length;
    const s=sentWords[sentIdx];
    const placeWord=(i)=>{
      if(sentCorrect) return;
      const w=sentRemaining[i];
      const newP=[...sentPlaced,w];
      const newR=sentRemaining.filter((_,j)=>j!==i);
      setSentPlaced(newP); setSentRemaining(newR);
      if(s&&newP.join(' ')===s.wds.join(' ')){
        setSentCorrect(true);
        // Cümle kurma XP vermez — sadece kilidi açmak için zorunlu
      }
    };
    const removeWord=(i)=>{
      if(sentCorrect) return;
      const w=sentPlaced[i];
      setSentRemaining(r=>[...r,w]);
      setSentPlaced(p=>p.filter((_,j)=>j!==i));
    };
    const showAnswer=()=>{
      if(!s) return;
      setSentPlaced([...s.wds]); setSentRemaining([]); setSentCorrect(true);
    };
    return html`
      <div style=${{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column'}}>
        <div style=${{display:'flex',alignItems:'center',gap:12,padding:'16px 20px',borderBottom:'1px solid '+C.brd,position:'sticky',top:0,background:C.bg,zIndex:10}}>
          <button onClick=${()=>setView('home')} style=${{background:C.c2,border:'1px solid '+C.brd,borderRadius:10,width:36,height:36,color:C.text,fontSize:18}}>←</button>
          <div style=${{...SY,fontSize:17,fontWeight:700}}>✍️ Cümle Kurma</div>
          <div style=${{marginLeft:'auto',fontSize:12,color:C.gold,fontWeight:700}}>${sentIdx+1}/${total}</div>
        </div>
        <div style=${{flex:1,overflowY:'auto',padding:'18px 20px 40px'}} className="sh">
          ${sentFinished?html`
            <div style=${{textAlign:'center',padding:'40px 20px'}} className="pop">
              <div style=${{fontSize:72,marginBottom:16}}>🎉</div>
              <div style=${{...SY,fontSize:28,fontWeight:800,marginBottom:8}}>Harikasın!</div>
              <div style=${{fontSize:15,color:C.muted,marginBottom:24}}>${total} cümleyi tamamladın!</div>
              <div style=${{background:'rgba(16,232,168,0.08)',border:'1px solid rgba(16,232,168,0.2)',borderRadius:16,padding:20,marginBottom:24}}>
                <div style=${{...SY,fontSize:11,color:C.muted,fontWeight:700,marginBottom:6}}>KAZANILAN XP</div>
                <div style=${{...SY,fontSize:40,fontWeight:800,color:TC.accent}}>+${total*15} XP</div>
              </div>
              <button onClick=${()=>{markSentenceDone(completedDays.size);setView('home');}} style=${{width:'100%',padding:14,borderRadius:14,background:TC.accent,color:'#000',fontWeight:700,fontSize:15,...SY}}>Ana Sayfaya Dön ✅</button>
            </div>
          `:html`
            <div style=${{display:'flex',gap:4,marginBottom:18}}>
              ${sentWords.map((_,i)=>html`<div key=${i} style=${{height:4,flex:1,borderRadius:2,background:i<sentIdx?TC.accent:i===sentIdx?C.gold:C.c2}}></div>`)}
            </div>
            <div style=${{background:'linear-gradient(135deg,rgba(251,191,36,0.08),rgba(251,146,60,0.05))',border:'1px solid rgba(251,191,36,0.22)',borderRadius:18,padding:20,marginBottom:16}}>
              <div style=${{...SY,fontSize:11,color:C.gold,fontWeight:700,letterSpacing:.5,marginBottom:8}}>TÜRKÇE ANLAM</div>
              <div style=${{...SY,fontSize:20,fontWeight:700,color:C.text,lineHeight:1.5}}>${s?s.tr:''}</div>
            </div>
            <div style=${{background:C.c1,borderRadius:18,padding:16,marginBottom:12,border:'1.5px solid '+(sentCorrect?TC.accent:C.brd),minHeight:64,transition:'border-color .3s'}}>
              <div style=${{fontSize:11,color:C.muted,marginBottom:10,fontWeight:600}}>${sentCorrect?'✅ Doğru cümle!':'→ Cümleyi buraya kur:'}</div>
              <div style=${{display:'flex',flexWrap:'wrap',gap:7,minHeight:36}}>
                ${sentPlaced.map((w,i)=>html`
                  <button key=${i+'_'+w} onClick=${()=>removeWord(i)}
                    style=${{padding:'8px 13px',borderRadius:10,
                      background:sentCorrect?'rgba(16,232,168,0.14)':'rgba(56,189,248,0.1)',
                      border:'1.5px solid '+(sentCorrect?TC.accent:TC.blue),
                      color:sentCorrect?TC.accent:TC.blue,
                      fontSize:14,fontWeight:700,...SY,cursor:sentCorrect?'default':'pointer'}}>
                    ${w}
                  </button>
                `)}
                ${sentPlaced.length===0&&html`<div style=${{fontSize:13,color:C.muted,fontStyle:'italic',paddingTop:6}}>Aşağıdan kelime seç...</div>`}
              </div>
            </div>
            ${!sentCorrect&&html`
              <div style=${{background:C.c2,borderRadius:18,padding:16,marginBottom:12,border:'1px solid '+C.brd}}>
                <div style=${{fontSize:11,color:C.muted,marginBottom:10,fontWeight:600}}>KELİMELER — sıraya koy:</div>
                <div style=${{display:'flex',flexWrap:'wrap',gap:7}}>
                  ${sentRemaining.map((w,i)=>html`
                    <button key=${i+'_'+w} onClick=${()=>placeWord(i)}
                      style=${{padding:'9px 14px',borderRadius:10,
                        background:C.c1,border:'1.5px solid '+C.brd,
                        color:C.text,fontSize:14,fontWeight:600,...SY}}>
                      ${w}

                  `)}
                </div>
              </div>
              <div style=${{display:'flex',gap:10,marginBottom:8}}>
                <button onClick=${()=>{setSentPlaced([]);setSentRemaining([...s.wds].sort(()=>Math.random()-.5));}} style=${{flex:1,padding:'10px 0',borderRadius:12,background:'rgba(248,113,113,0.07)',border:'1px solid rgba(248,113,113,0.18)',color:C.red,fontWeight:700,fontSize:12,...SY}}>🔄 Sıfırla</button>
                <button onClick=${showAnswer} style=${{flex:2,padding:'10px 0',borderRadius:12,background:'rgba(192,132,252,0.07)',border:'1px solid rgba(192,132,252,0.18)',color:C.purple,fontWeight:700,fontSize:12,...SY}}>💡 Cevabı Göster (XP yok)</button>
              </div>
              <div style=${{fontSize:11,color:C.muted,textAlign:'center'}}>Yerleştirdiğin kelimeye tıklarsan geri alırsın</div>

            ${sentCorrect&&html`
              <div style=${{background:'rgba(16,232,168,0.07)',border:'1px solid rgba(16,232,168,0.2)',borderRadius:14,padding:'14px 18px',marginBottom:14}}>

          `}
        </div>
      </div>`;
  }

  /* ─── BONUS ÇALIŞMA ─── */
  if(showBonus){
    // Hafta seçici
    if(!bonusWeekNum){
      return html`
        <div style=${{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column'}}>
          <div style=${{display:'flex',alignItems:'center',gap:8,padding:'14px 20px',borderBottom:'1px solid '+C.brd}}>

            ${Array.from({length:25},(_,i)=>i+1).map(wn=>{
              const bw2=BONUS_WEEKS[wn];
              const active=!!bw2;
              return html`<button key=${wn} onClick=${()=>{if(!active)return;setBonusWeekNum(wn);setBonusQIdx(0);setBonusChosen(null);setBonusAnswered(false);setBonusFinished(false);}} style=${{width:'100%',display:'flex',alignItems:'center',gap:14,padding:'14px 16px',borderRadius:16,background:active?C.c2:C.c1,border:'1px solid '+(active?'rgba(192,132,252,0.25)':C.brd),marginBottom:8,opacity:active?1:0.45,cursor:active?'pointer':'not-allowed',textAlign:'left',transition:'all .15s'}}>
                <div style=${{...SY,fontSize:22,fontWeight:800,color:'rgba(192,132,252,0.5)',minWidth:36}}>${wn}</div>
                <div style=${{flex:1,minWidth:0}}>
                  <div style=${{...SY,fontSize:13,fontWeight:700,color:active?C.text:C.muted,marginBottom:3}}>${active?bw2.title:'🔒 Yakında'}</div>
                  <div style=${{fontSize:11,color:C.muted,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${active?bw2.desc:'Bu hafta henüz eklenmedi.'}</div>
                </div>
                ${active&&html`<div style=${{color:'#c084fc',fontSize:18}}>→</div>`}
              </button>`;
            })}
          </div>
        </div>`;
    }

    const bw=BONUS_WEEKS[bonusWeekNum];
    if(!bw)return null;
    const acts=bw.activities;
    const act=acts[bonusQIdx];
    const total=acts.length;

    // Fill activity state: bonusChosen=input string, bonusAnswered=submitted
    // Quiz activity: bonusChosen=selected option, bonusAnswered=submitted
    // Info/Dialogue: bonusChosen=null, bonusAnswered=false (just press next)

    const goNext=()=>{
      if(bonusQIdx<total-1){setBonusQIdx(i=>i+1);setBonusChosen(null);setBonusAnswered(false);}
      else setBonusFinished(true);
    };

    const renderActivity=(act)=>{
      if(!act)return null;

      // ── INFO KARTI ──
      if(act.type==='info') return html`
        <div className="slideIn">
          <div style=${{...SY,fontSize:16,fontWeight:800,marginBottom:14,color:TC.accent}}>${act.title}</div>
          <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:14}}>
            ${act.content.map((item,i)=>html`
              <div key=${i} style=${{background:C.c2,borderRadius:10,padding:'9px 12px',border:'1px solid '+C.brd}}>
                <div style=${{...SY,fontSize:13,fontWeight:700,color:TC.accent}}>${item.en}</div>
                <div style=${{fontSize:11,color:C.muted,marginTop:2}}>${item.tr}</div>
              </div>
            `)}
          </div>
          ${act.note&&html`
            <div style=${{background:'rgba(192,132,252,0.07)',border:'1px solid rgba(192,132,252,0.2)',borderRadius:12,padding:'10px 14px',fontSize:12,color:'#c084fc',lineHeight:1.7,marginBottom:14}}>
              💡 ${act.note}
            </div>
          `}
          <button onClick=${goNext} style=${{width:'100%',padding:14,borderRadius:14,background:'#c084fc',color:'#000',fontSize:14,fontWeight:700,...SY}}>
            ${bonusQIdx<total-1?'Devam →':'Tamamla ✨'}
          </button>
        </div>
      `;

      // ── DİYALOG ──
      if(act.type==='dialogue') return html`
        <div className="slideIn">
          <div style=${{...SY,fontSize:15,fontWeight:800,marginBottom:14,color:'#c084fc'}}>${act.title}</div>
          <div style=${{background:C.c2,borderRadius:16,padding:14,marginBottom:14,border:'1px solid '+C.brd}}>
            ${act.lines.map((line,i)=>html`
              <div key=${i} style=${{display:'flex',gap:10,marginBottom:10,alignItems:'flex-start'}}>
                <div style=${{...SY,fontSize:11,fontWeight:700,color:'#c084fc',minWidth:60,paddingTop:2}}>${line.who}</div>
                <div style=${{flex:1}}>
                  <div style=${{fontSize:13,color:C.text,lineHeight:1.5}}>${line.text}</div>
                  <div style=${{fontSize:11,color:C.muted,marginTop:3,fontStyle:'italic'}}>${line.tr}</div>
                </div>
              </div>
            `)}
          </div>
          <div style=${{background:C.c1,borderRadius:14,padding:16,marginBottom:14,border:'1px solid '+C.brd}}>
            <div style=${{fontSize:12,color:C.muted,marginBottom:10,fontWeight:600}}>❓ ${act.q}</div>
            <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
              ${act.opts.map(opt=>{
                let bg=C.c2,cl=C.text,br=C.brd;
                if(bonusAnswered){
                  if(opt===act.ans){bg='rgba(16,232,168,0.12)';cl=TC.accent;br=TC.accent;}
                  else if(opt===bonusChosen&&opt!==act.ans){bg='rgba(248,113,113,0.1)';cl=C.red;br=C.red;}
                  else cl=C.muted;
                } else if(opt===bonusChosen){bg='rgba(192,132,252,0.1)';br='#c084fc';cl='#c084fc';}
                return html`<button key=${opt} onClick=${()=>{if(!bonusAnswered){setBonusChosen(opt);setBonusAnswered(true);}}} style=${{padding:'11px 8px',borderRadius:11,background:bg,color:cl,border:'1.5px solid '+br,fontSize:12,fontWeight:600,textAlign:'center',...SY,transition:'all .2s'}}>
                  ${opt}
                </button>`;
              })}
            </div>
            ${bonusAnswered&&html`
              <div style=${{marginTop:10,padding:'8px 12px',borderRadius:10,background:bonusChosen===act.ans?'rgba(16,232,168,0.06)':'rgba(248,113,113,0.06)',border:'1px solid '+(bonusChosen===act.ans?'rgba(16,232,168,0.2)':'rgba(248,113,113,0.2)')}}>
                <div style=${{...SY,fontSize:13,fontWeight:700,color:bonusChosen===act.ans?TC.accent:C.red}}>
                  ${bonusChosen===act.ans?'✅ Doğru!':'❌ Yanlış — Doğru: '+act.ans}
                </div>
              </div>
              <button onClick=${goNext} style=${{width:'100%',padding:13,borderRadius:13,background:'#c084fc',color:'#000',fontSize:14,fontWeight:700,...SY,marginTop:10}}>
                ${bonusQIdx<total-1?'Devam →':'Tamamla ✨'}
              </button>
            `}
          </div>
        </div>
      `;

      // ── BOŞLUK DOLDUR ──
      if(act.type==='fill'){
        const items=act.items;
        const fillIdx=bonusAnswered===false&&bonusChosen===null?0:parseInt(bonusChosen?.split('|')[0]||'0');
        const fillInput=bonusChosen?.split('|')[1]||'';
        const fillDone=bonusChosen?.split('|')[2]==='done';
        const item=items[fillIdx];
        const isCorrect=fillInput.trim().toLowerCase()===item?.ans.toLowerCase();

        return html`
          <div className="slideIn">
            <div style=${{...SY,fontSize:15,fontWeight:800,marginBottom:14,color:TC.accent}}>${act.title}</div>
            <div style=${{fontSize:11,color:C.muted,marginBottom:14}}>${fillIdx+1} / ${items.length}</div>
            ${item&&html`
              <div style=${{background:C.c1,borderRadius:18,padding:22,border:'1px solid '+C.brd,marginBottom:12}}>
                <div style=${{fontSize:15,color:C.text,marginBottom:16,lineHeight:1.7}}>
                  ${item.q.replace('___','<___>')}
                </div>
                <div style=${{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
                  <input
                    type="text"
                    placeholder="${item.hint}..."
                    value=${fillInput}
                    onInput=${e=>setBonusChosen(fillIdx+'|'+e.target.value+(fillDone?'|done':''))}
                    disabled=${fillDone}
                    style=${{flex:1,padding:'11px 14px',borderRadius:11,background:'rgba(255,255,255,0.05)',border:'1.5px solid '+(fillDone?(isCorrect?TC.accent:C.red):C.brd),color:C.text,fontSize:14,outline:'none'}}
                  />
                  ${!fillDone&&html`
                    <button onClick=${()=>{setBonusChosen(fillIdx+'|'+fillInput+'|done');}} style=${{padding:'11px 16px',borderRadius:11,background:TC.accent,color:'#000',fontWeight:700,fontSize:13,...SY,flexShrink:0}}>
                      Kontrol
                    </button>
                  `}
                </div>
                ${fillDone&&html`
                  <div style=${{padding:'8px 12px',borderRadius:10,background:isCorrect?'rgba(16,232,168,0.06)':'rgba(248,113,113,0.06)',border:'1px solid '+(isCorrect?'rgba(16,232,168,0.2)':'rgba(248,113,113,0.2)'),fontSize:12,color:isCorrect?TC.accent:C.red,fontWeight:600}}>
                    ${isCorrect?'✅ Doğru!':'❌ Doğru cevap: '+item.ans}
                  </div>
                  <button onClick=${()=>{
                    if(fillIdx<items.length-1){setBonusChosen((fillIdx+1)+'|');}
                    else goNext();
                  }} style=${{width:'100%',padding:13,borderRadius:13,background:'#c084fc',color:'#000',fontSize:14,fontWeight:700,...SY,marginTop:10}}>
                    ${fillIdx<items.length-1?'Sonraki →':bonusQIdx<total-1?'Devam →':'Tamamla ✨'}
                  </button>
                `}
              </div>
            `}
          </div>
        `;
      }

      // ── ÇOK ŞIKLI TEST ──
      if(act.type==='quiz'){
        const qs=act.questions;
        const qIdx=bonusAnswered===false&&bonusChosen===null?0:parseInt(bonusChosen?.split('|')[0]||'0');
        const chosen=bonusChosen?.split('|')[1]||null;
        const answered=bonusChosen?.split('|')[2]==='a';
        const q=qs[qIdx];
        const isCorrect=chosen===q?.ans;
        return html`
          <div className="slideIn">
            <div style=${{...SY,fontSize:15,fontWeight:800,marginBottom:14,color:TC.accent}}>${act.title}</div>
            <div style=${{fontSize:11,color:C.muted,marginBottom:14}}>${qIdx+1} / ${qs.length}</div>
            ${q&&html`
              <div style=${{background:C.c1,borderRadius:18,padding:20,border:'1px solid '+C.brd,marginBottom:12}}>
                <div style=${{...SY,fontSize:15,fontWeight:700,color:C.text,marginBottom:18,lineHeight:1.5}}>${q.q}</div>
                <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  ${q.opts.map(opt=>{
                    let bg=C.c2,cl=C.text,br=C.brd;
                    if(answered){
                      if(opt===q.ans){bg='rgba(16,232,168,0.12)';cl=TC.accent;br=TC.accent;}
                      else if(opt===chosen&&!isCorrect){bg='rgba(248,113,113,0.1)';cl=C.red;br=C.red;}
                      else cl=C.muted;
                    } else if(opt===chosen){bg='rgba(192,132,252,0.1)';br='#c084fc';cl='#c084fc';}
                    return html`<button key=${opt} onClick=${()=>{if(!answered) setBonusChosen(qIdx+'|'+opt+'|a');}} style=${{padding:'12px 8px',borderRadius:11,background:bg,color:cl,border:'1.5px solid '+br,fontSize:12,fontWeight:600,textAlign:'center',...SY,transition:'all .2s'}}>
                      ${opt}
                    </button>`;
                  })}
                </div>
                ${answered&&html`
                  <div style=${{marginTop:12,padding:'8px 12px',borderRadius:10,background:isCorrect?'rgba(16,232,168,0.06)':'rgba(248,113,113,0.06)',border:'1px solid '+(isCorrect?'rgba(16,232,168,0.2)':'rgba(248,113,113,0.2)'),fontSize:12,color:isCorrect?TC.accent:C.red,fontWeight:600}}>
                    ${isCorrect?'✅ Doğru!':'❌ Doğru cevap: '+q.ans}
                  </div>
                  <button onClick=${()=>{
                    if(qIdx<qs.length-1){setBonusChosen((qIdx+1)+'|');}
                    else goNext();
                  }} style=${{width:'100%',padding:13,borderRadius:13,background:'#c084fc',color:'#000',fontSize:14,fontWeight:700,...SY,marginTop:10}}>
                    ${qIdx<qs.length-1?'Sonraki →':bonusQIdx<total-1?'Devam →':'Tamamla ✨'}
                  </button>
                `}
              </div>
            `}
          </div>
        `;
      }

      // ── YAZIM TESTİ (spell) ──
      if(act.type==='spell'){
        const items=act.items;
        // bonusChosen format: "itemIdx|typed|revealed_csv|done"
        const parts=(bonusChosen||'').split('|');
        const itemIdx=parseInt(parts[0])||0;
        const typed=(parts[1]||'').split(',').filter(x=>x!=='');
        const revealedSet=new Set((parts[2]||'').split(',').filter(x=>x!=='').map(Number));
        const itemDone=parts[3]==='done';
        const item=items[itemIdx];
        const letters=item?item.ans.split(''):[]; 
        const total2=letters.length;

        const saveState=(idx,t,rev,done)=>{
          setBonusChosen(idx+'|'+t.join(',')+'|'+[...rev].join(',')+' |'+(done?'done':''));
        };

        const nextPos=letters.findIndex((_,i)=>typed[i]===undefined&&!revealedSet.has(i));
        const allFilled=letters.every((_,i)=>typed[i]!==undefined||revealedSet.has(i)||letters[i]===' ');

        const bgM={hint:'rgba(16,232,168,0.15)',correct:'rgba(16,232,168,0.15)',wrong:'rgba(248,113,113,0.2)',active:'rgba(251,191,36,0.1)',empty:'rgba(255,255,255,0.04)'};
        const brM={hint:TC.accent,correct:TC.accent,wrong:C.red,active:C.gold,empty:'rgba(255,255,255,0.07)'};
        const clM={hint:TC.accent,correct:TC.accent,wrong:C.red,active:C.gold,empty:'transparent'};

        const getBoxSt=(pos)=>{
          if(revealedSet.has(pos)) return 'hint';
          if(typed[pos]!==undefined) return 'correct';
          const filledBefore=letters.filter((_,i)=>i<pos&&(typed[i]!==undefined||revealedSet.has(i))).length;
          const myPos=letters.filter((_,i)=>i<pos&&letters[i]!==' ').length;
          const filledCount=letters.filter((_,i)=>typed[i]!==undefined||revealedSet.has(i)).length;
          if(filledCount===myPos&&letters[pos]!==' ') return 'active';
          return 'empty';
        };

        const handleSpellKey=(char)=>{
          if(itemDone||bonusBlocked) return;
          let pos=letters.findIndex((_,i)=>typed[i]===undefined&&!revealedSet.has(i));
          if(pos===-1) return;
          if(letters[pos]===' '){
            const newT=[...typed]; newT[pos]=' ';
            pos=letters.findIndex((_,i)=>i>pos&&newT[i]===undefined&&!revealedSet.has(i));
            if(pos===-1) return;
          }
          const ok=char.toLowerCase()===letters[pos].toLowerCase();
          const newT=[...typed];
          letters.forEach((l,i)=>{if(l===' '&&newT[i]===undefined)newT[i]=' ';});
          newT[pos]=char;
          if(!ok){
            setBonusBlocked(true);
            // Yanlış harfi state'e yazma, sadece animasyon için geçici renk
            const wT=[...newT]; wT[pos]=undefined; // yanlışı kabul etme
            setBonusChosen(itemIdx+'|'+wT.join(',')+'|'+[...revealedSet].join(',')+' |wrong_'+pos);
            setTimeout(()=>{
              setBonusChosen(itemIdx+'|'+wT.join(',')+'|'+[...revealedSet].join(',')+' |');
              setBonusBlocked(false);
            },400);
          } else {
            const done=letters.every((_,i)=>newT[i]!==undefined||revealedSet.has(i));
            setBonusChosen(itemIdx+'|'+newT.join(',')+'|'+[...revealedSet].join(',')+' |'+(done?'done':''));
          }
        };

        const isWrong=parts[3]?.startsWith('wrong_');
        const wrongPos=isWrong?parseInt(parts[3].split('_')[1]):-1;

        return html`
          <div className="slideIn">
            <div style=${{...SY,fontSize:15,fontWeight:800,marginBottom:6,color:TC.accent}}>${act.title}</div>
            <div style=${{fontSize:11,color:C.muted,marginBottom:16}}>${itemIdx+1} / ${items.length} kelime</div>
            <div style=${{background:C.c1,borderRadius:18,padding:20,border:'1px solid '+C.brd,marginBottom:12}}>
              <div style=${{fontSize:13,color:C.muted,marginBottom:6}}>İngilizce yaz:</div>
              <div style=${{...SY,fontSize:32,fontWeight:800,color:C.text,marginBottom:16}}>${item?.prompt}</div>
              <div style=${{display:'flex',gap:3,justifyContent:'center',flexWrap:'nowrap',overflowX:'auto',marginBottom:12,paddingBottom:2}} className="sh">
                ${letters.map((letter,pos)=>{
                  if(letter===' ') return html`<div key=${pos} style=${{width:8,flexShrink:0}}></div>`;
                  const st=getBoxSt(pos);
                  const isWrPos=isWrong&&pos===wrongPos;
                  const bg=isWrPos?'rgba(248,113,113,0.2)':bgM[st];
                  const br=isWrPos?C.red:brM[st];
                  const cl=isWrPos?C.red:clM[st];
                  const showCharFixed=(typed[pos]!==undefined||revealedSet.has(pos))&&!isWrPos;
                  const bw=Math.max(18,Math.min(34,Math.floor(320/(total2+1))));
                  const bh=Math.max(26,Math.min(42,Math.floor(330/(total2+1))));
                  const bf=Math.max(10,Math.min(18,Math.floor(290/(total2+1))));
                  const showChar=showCharFixed;
                  return html`<div key=${pos} style=${{width:bw,height:bh,borderRadius:6,border:'2px solid '+br,background:bg,display:'flex',alignItems:'center',justifyContent:'center',...SY,fontSize:bf,fontWeight:800,color:cl,transition:'all .2s',flexShrink:0,animation:isWrPos?'pulse .3s ease':'none'}}>
                    ${showChar?letter.toUpperCase():''}
                  </div>`;
                })}
              </div>
              ${!itemDone&&html`
                <button onClick=${()=>{
                  if(nextPos===-1) return;
                  const newRev=new Set([...revealedSet,nextPos]);
                  const allDone2=letters.every((_,i)=>typed[i]!==undefined||newRev.has(i)||letters[i]===' ');
                  setBonusChosen(itemIdx+'|'+typed.join(',')+'|'+[...newRev].join(',')+' |'+(allDone2?'done':''));
                }} style=${{width:'100%',padding:'9px 0',borderRadius:11,background:'rgba(192,132,252,0.08)',border:'1px solid rgba(192,132,252,0.2)',color:'#c084fc',fontWeight:700,fontSize:12,...SY,marginBottom:10}}>
                  💡 İpucu — Sonraki Harfi Göster
                </button>
              `}
              ${itemDone&&html`
                <div style=${{padding:'8px 12px',borderRadius:10,background:'rgba(16,232,168,0.06)',border:'1px solid rgba(16,232,168,0.15)',fontSize:13,color:TC.accent,fontWeight:700,textAlign:'center',marginBottom:10}}>
                  ✅ ${item.ans.toUpperCase()}
                </div>
                <button onClick=${()=>{
                  if(itemIdx<items.length-1){setBonusChosen((itemIdx+1)+'| | |');}
                  else goNext();
                }} style=${{width:'100%',padding:13,borderRadius:13,background:'#c084fc',color:'#000',fontSize:14,fontWeight:700,...SY}}>
                  ${itemIdx<items.length-1?'Sonraki Kelime →':bonusQIdx<total-1?'Devam →':'Tamamla ✨'}
                </button>
              `}
              <!-- Ekran klavyesi -->
              ${!itemDone&&html`
                <div style=${{background:C.c2,borderRadius:14,padding:10,border:'1px solid '+C.brd,marginTop:4}}>
                  ${[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['Z','X','C','V','B','N','M','⌫']].map((row,ri)=>html`
                    <div key=${ri} style=${{display:'flex',gap:3,justifyContent:'center',marginBottom:4}}>
                      ${row.map(k=>html`
                        <button key=${k} onClick=${()=>{
                          if(k==='⌫'){
                            let dPos=-1;
                            for(let i=letters.length-1;i>=0;i--){
                              if(letters[i]===' ') continue;
                              if(revealedSet.has(i)||typed[i]!==undefined){dPos=i;break;}
                            }
                            if(dPos!==-1){
                              const newRev2=new Set(revealedSet);
                              const newT2=[...typed];
                              if(revealedSet.has(dPos)) newRev2.delete(dPos);
                              newT2[dPos]=undefined;
                              setBonusChosen(itemIdx+'|'+newT2.join(',')+'|'+[...newRev2].join(',')+' |');
                            }
                          } else handleSpellKey(k);
                        }} style=${{flex:k==='⌫'?1.5:1,padding:'7px 0',borderRadius:7,background:C.c1,border:'1px solid '+C.brd,color:C.text,fontSize:k==='⌫'?14:12,fontWeight:700,minWidth:k==='⌫'?30:22,...SY}}>
                          ${k}
                        </button>
                      `)}
                    </div>
                  `)}
                </div>
              `}
            </div>
          </div>
        `;
      }

      return null;
    };

    return html`
      <div style=${{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column'}}>
        <div style=${{display:'flex',alignItems:'center',gap:8,padding:'14px 20px',borderBottom:'1px solid '+C.brd,position:'sticky',top:0,background:C.bg,zIndex:10}}>
          <button onClick=${()=>setBonusWeekNum(null)} style=${{background:C.c2,border:'1px solid '+C.brd,borderRadius:10,width:34,height:34,color:C.text,fontSize:15,flexShrink:0}}>←</button>
          <button onClick=${()=>{setBonusWeekNum(null);setShowBonus(false);}} style=${{background:C.c2,border:'1px solid '+C.brd,borderRadius:10,width:34,height:34,color:C.text,fontSize:16,flexShrink:0}}>🏠</button>
          <div style=${{flex:1,minWidth:0}}>
            <div style=${{...SY,fontSize:12,fontWeight:700,color:'#c084fc'}}>${bw.title}</div>
            <div style=${{fontSize:11,color:C.muted}}>${bonusFinished?'Tamamlandı ✨':((bonusQIdx+1)+'. aktivite / '+total)}</div>
          </div>
          <div style=${{display:'flex',gap:4}}>
            ${acts.map((_,i)=>html`<div key=${i} style=${{width:6,height:6,borderRadius:'50%',background:i<bonusQIdx?'#c084fc':i===bonusQIdx?TC.accent:C.brd}}></div>`)}
          </div>
        </div>

        <div style=${{flex:1,overflowY:'auto',padding:'18px 20px 60px'}} className="sh">
          ${bonusFinished?html`
            <div style=${{textAlign:'center',padding:'40px 16px'}} className="pop">
              <div style=${{fontSize:72,marginBottom:16}}>✨</div>
              <div style=${{...SY,fontSize:24,fontWeight:800,marginBottom:8,color:'#c084fc'}}>${bw.title}</div>
              <div style=${{fontSize:14,color:C.muted,marginBottom:24,lineHeight:1.7}}>Tüm aktiviteleri tamamladın!<br/>Bu çalışma XP vermez ama bilgin güçlendi.</div>
              <button onClick=${()=>setBonusWeekNum(null)} style=${{width:'100%',padding:15,borderRadius:14,background:'#c084fc',color:'#000',fontSize:15,fontWeight:700,...SY}}>
                Ana Sayfaya Dön 🏠
              </button>
            </div>
          `:renderActivity(act)}
        </div>
      </div>`;
  }


  /* ─── HAFTALIK SINAV ─── */
  if(weeklyView){
    const totalQ=weeklyQuestions.length;
    const wq=weeklyQuestions[weeklyQIdx];
    const answeredR=totalQ-weeklySkipped;
    const passed2=answeredR/Math.max(totalQ,1)>=0.7&&weeklyHintsTotal<50;
    
    const failMsg = answeredR < totalQ * 0.7 
      ? `Soruların en az %70'ini cevaplamalısın. ${weeklySkipped} soru atlandı.` 
      : `50'den fazla ipucu kullandın (${weeklyHintsTotal} ipucu). Daha az ipucu ile tekrar dene.`;
      
    const passMsg = weeklyScore >= totalQ * 2.5 
      ? `🌟 Mükemmel! Kelimelere çok hakimsin.` 
      : weeklyScore >= totalQ * 1.5 
        ? `👍 İyi iş! Biraz daha pratik yaparsan mükemmel olacak.` 
        : `💪 Devam et! Hata defterini düzenli gözden geçir.`;

    const wLetters=wq?wq.en.split(''):[]; 
    const wTotal=wLetters.length;
    const getWBoxState=(pos)=>{
      if(weeklyRevealed.has(pos)) return 'hint';
      if(weeklyTyped[pos]!==undefined){
        if(weeklyTyped[pos].toLowerCase()===wLetters[pos].toLowerCase()) return 'correct';
        return 'wrong';
      }
      const filledCount=weeklyTyped.filter((_,i)=>i<pos&&weeklyTyped[i]!==undefined).length+[...weeklyRevealed].filter(r=>r<pos).length;
      if(pos===weeklyTyped.filter((v)=>v!==undefined).length+[...weeklyRevealed].filter(r=>r<pos).length) return 'active';
      return 'empty';
    };

    const wNextPos=wLetters.findIndex((_,i)=>weeklyTyped[i]===undefined&&!weeklyRevealed.has(i));
    const handleWKey=(char)=>{
      if(weeklyDone||weeklyBlocked||!wq) return;
      let pos=wNextPos;
      if(pos===-1) return;
      if(wLetters[pos]===' '){
        const tmp=[...weeklyTyped];tmp[pos]=' ';
        setWeeklyTyped(tmp);
        pos=wLetters.findIndex((_,i)=>i>pos&&tmp[i]===undefined&&!weeklyRevealed.has(i));
        if(pos===-1) return;
      }
      const correct=char.toLowerCase()===wLetters[pos].toLowerCase();
      const newT=[...weeklyTyped];
      wLetters.forEach((l,i)=>{if(l===' '&&newT[i]===undefined)newT[i]=' ';});
      newT[pos]=char;
      setWeeklyTyped(newT);
      if(!correct){
        const nw=new Set([...weeklyWrong,pos]);setWeeklyWrong(nw);setWeeklyBlocked(true);
        setTimeout(()=>{setWeeklyTyped(t=>{const u=[...t];u[pos]=undefined;return u;});setWeeklyWrong(w=>{const n=new Set(w);n.delete(pos);return n;});setWeeklyBlocked(false);},700);
      } else {
        const allDone=wLetters.every((_,i)=>newT[i]!==undefined||weeklyRevealed.has(i));
        if(allDone){
          const hc=[...weeklyRevealed].filter(r=>r<wTotal).length;
          const pts=hc===0?3:hc<=2?2:1;
          setWeeklyScore(p=>p+pts);
          // Haftalık sınav XP vermez — sadece ilerleme testi
          setWeeklyDone(true);
        }
      }
    };
    const wGiveHint=()=>{
                  setWeeklyHintsTotal(h=>h+1);
      if(wNextPos===-1) return;
      setWeeklyRevealed(p=>new Set([...p,wNextPos]));
    };

    const wNextWord=()=>{
      if(weeklyQIdx<totalQ-1){
        setWeeklyQIdx(i=>i+1);
        setWeeklyTyped([]);setWeeklyWrong(new Set());setWeeklyRevealed(new Set());
        setWeeklyDone(false);setWeeklyBlocked(false);
      } else {
        finishWeeklyTest(weeklyScore+(weeklyDone?0:0));
      }
    };
    const bgMap2={hint:'rgba(16,232,168,0.15)',correct:'rgba(16,232,168,0.15)',wrong:'rgba(248,113,113,0.2)',active:'rgba(251,191,36,0.1)',empty:'rgba(255,255,255,0.04)'};
    const borderMap2={hint:'#10e8a8',correct:'#10e8a8',wrong:'#f87171',active:'#fbbf24',empty:'rgba(255,255,255,0.07)'};
    const colorMap2={hint:'#10e8a8',correct:'#10e8a8',wrong:'#f87171',active:'#fbbf24',empty:'transparent'};

    return html`
      <div style=${{background:C.bg,minHeight:'100vh',maxWidth:430,margin:'0 auto',display:'flex',flexDirection:'column'}}>
        <div style=${{display:'flex',alignItems:'center',gap:8,padding:'14px 20px',borderBottom:'1px solid '+C.brd,position:'sticky',top:0,background:C.bg,zIndex:10}}>
          <button onClick=${()=>setWeeklyView(false)} style=${{background:C.c2,border:'1px solid '+C.brd,borderRadius:10,width:34,height:34,color:C.text,fontSize:15,flexShrink:0}}>←</button>
          <button onClick=${()=>{setWeeklyView(false);}} style=${{background:C.c2,border:'1px solid '+C.brd,borderRadius:10,width:34,height:34,color:C.text,fontSize:16,flexShrink:0}} title="Ana Menü">🏠</button>
          <div style=${{flex:1,minWidth:0}}>

<script>

}

}

// Firebase'e XP'yi anında eşitleyen köprü fonksiyon
window.updateFirebaseXP = async function(newTotalXP) {
  let user = localStorage.getItem("user");
  if (!user) return; 

  try {
    await db.collection("users").doc(user).set({
      xp: newTotalXP
    }, { merge: true }); 
  } catch(error) {
    console.log("Skor tablosu güncellenemedi:", error);
  }
};

window.loadScores = async function loadScores() {
  // 1. Önce scoreboard kutusu var mı kontrol et, yoksa oluştur
  let modal = document.getElementById("scoreboardModal");
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'scoreboardModal';
    modal.style = `
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 380px; background: #0f172a; border: 1px solid #38bdf8;
      border-radius: 20px; padding: 20px; z-index: 10000; color: white;
      font-family: sans-serif; box-shadow: 0 0 30px rgba(0,0,0,0.8);
    `;
    document.body.appendChild(modal);
  }

  // 2. Yükleniyor mesajı
  modal.innerHTML = `<div style="text-align:center;">📊 Yükleniyor...</div>`;

  try {
    // 3. Verileri çek
    let snapshot = await db.collection("users").get();
    let data = [];
    snapshot.forEach(doc => {
      data.push({ name: doc.id, xp: doc.data().xp || 0 });
    });

    // 4. Sırala (En yüksek XP üstte)
    data.sort((a, b) => b.xp - a.xp);

    // 5. Listeyi oluştur
    let listHTML = data.map((u, index) => `
      <div style="display:flex; justify-content:space-between; background:rgba(255,255,255,0.05); padding:12px; margin-bottom:8px; border-radius:10px;">
        <span>${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : (index + 1) + '.'} ${u.name}</span>
        <span style="color:#38bdf8; font-weight:bold;">${u.xp} XP</span>
      </div>
    `).join("");

    // 6. Kapat butonu ve listeyi yerleştir
    modal.innerHTML = `
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
        <h3 style="margin:0;">🏆 Liderlik Tablosu</h3>
        <button onclick="document.getElementById('scoreboardModal').remove()" style="background:none; border:none; color:#ff4757; cursor:pointer; font-size:18px;">✕</button>
      </div>
      <div style="max-height:300px; overflow-y:auto; padding-right:5px;">
        ${listHTML}
      </div>
    `;
  } catch (error) {
    modal.innerHTML = `<div style="color:red;">Hata: Veriler alınamadı!</div>`;
  }
}

</script>
